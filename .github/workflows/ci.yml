name: Kindred CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 🧪 Quality, Tests & Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Root Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 📦 Install Cloud Functions Dependencies
        run: npm ci --prefix functions --legacy-peer-deps || npm install --prefix functions --legacy-peer-deps

      - name: 📝 TypeScript Compilation Check
        run: npm run typecheck

      - name: 🧹 ESLint Static Analysis
        run: npm run lint

      - name: 🧪 Run React Native Jest Tests (245 tests)
        run: npm test -- --no-coverage

      - name: 🛡️ Run Firestore Security Rules Tests (22 tests in emulator)
        run: npm run test:rules
