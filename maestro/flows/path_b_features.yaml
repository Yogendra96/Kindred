appId: org.reactjs.native.example.Kindred
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Agree & Continue"
    commands:
      - tapOn: "Agree & Continue"

# Dismiss any open dialog if present
- runFlow:
    when:
      visible: "Keep Going 🌱"
    commands:
      - tapOn: "Keep Going 🌱"

- extendedWaitUntil:
    visible: "Home, tab, 1 of 6"
    timeout: 30000

# Test Path B: Real-Time Social Dashboard
- tapOn: "Social, tab, 4 of 6"
- extendedWaitUntil:
    visible: ".*Community.*"
    timeout: 10000

- tapOn: "Live"
- extendedWaitUntil:
    visible: ".*Feed.*"
    timeout: 10000

# Test Path B: AI Vision Camera
- tapOn: "Home, tab, 1 of 6"
- swipe:
    direction: UP
- swipe:
    direction: UP
- extendedWaitUntil:
    visible: "AI Vision Scanner"
    timeout: 10000
- tapOn: "AI Vision Scanner"

- extendedWaitUntil:
    visible: ".*Smart Waste.*"
    timeout: 10000
- tapOn: ".*Smart Waste.*"

- runFlow:
    when:
      visible: ".*Cancel.*"
    commands:
      - tapOn: ".*Cancel.*"
