# SonarCloud Configuration
sonar.projectKey=kindred_kindred-carbon-tracker
sonar.organization=kindred
sonar.projectName=Kindred Carbon Tracker
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/android/**,**/ios/**,**/*.stories.tsx

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gates
sonar.qualitygate.wait=true

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.tsx,**/index.ts

# Language settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Security
sonar.security.hotspots.enabled=true